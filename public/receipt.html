<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Receipt</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Payment Receipt</h1>

    <p><strong>Status:</strong> Payment Completed</p>

    <p><strong>Amount:</strong> 50 AED</p>

    <p><strong>Reference:</strong> PAY-725</p>

    <hr>

    <p id="emailDisplay"></p>

    <div class="notice">
        Please confirm that you received your receipt.
    </div>

    <button id="confirmReceipt" type="button">
        I received my receipt
    </button>

    <p id="confirmationMessage" aria-live="polite"></p>

</div>

<script src="receipt.js"></script>

</body>
</html>
